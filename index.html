<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu da cafeteria</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="menu">
      <main>
        <h1>CAFÉ SUAVE</h1>
        <p class="established">Desde 2026</p>
        <hr>
        <section>
          <h2>Cafés</h2>
          <img src="https://br.freepik.com/vetores-premium/design-de-icone-de-logotipo-de-cafe_34735719.htm" alt="coffee icon"/>
          <article class="item">
            <p class="flavor">French Vanilla</p><p class="price">R$15,00</p>
          </article>
          <article class="item">
            <p class="flavor">Caramel Macchiato</p><p class="price">R$10,75</p>
          </article>
          <article class="item">
            <p class="flavor">Pumpkin Spice</p><p class="price">R$20,00</p>
          </article>
          <article class="item">
            <p class="flavor">Hazelnut</p><p class="price">R$12,00</p>
          </article>
          <article class="item">
            <p class="flavor">Mocha</p><p class="price">R$8,50</p>
          </article>
        </section>
        <section>
          <h2>Sobremesas</h2>
          <img src="https://br.freepik.com/vetores-premium/icone-de-vetor-de-torta-em-fundo-branco_46964978.htm" alt="pie icon"/>
          <article class="item">
            <p class="dessert">Donut</p><p class="price">R$10,50</p>
          </article>
          <article class="item">
            <p class="dessert">Cherry Pie</p><p class="price">R$22,75</p>
          </article>
          <article class="item">
            <p class="dessert">Cheesecake</p><p class="price">R$23,00</p>
          </article>
          <article class="item">
            <p class="dessert">Cinnamon Roll</p><p class="price">R$12,50</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line">
      <footer>
        <address>
          <p>
            <a href="" target="_blank">Visite nosso Site</a>
          </p>
          <p class="address">123 Rua do Grão</p>
        </address>
      </footer>
    </div>
  </body>
</html>
